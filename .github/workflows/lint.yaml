on: [push, pull_request]
name: Lint Python

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    # Pinned, so a new linter release cannot fail the build on its own
    - run: pip install black==26.10.1 flake8==7.5.0 isort==9.0.2
    - run: flake8
    - run: black --check .
    - run: isort . --check
